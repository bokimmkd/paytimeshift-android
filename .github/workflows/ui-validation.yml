name: PTS Android UI validation
on:
  workflow_dispatch:
  push:
    branches: [premium-analytics-upgrade]
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/ui-validation.yml"
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumented UI tests
        run: gradle assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            gradle connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.paytimeshift.pts/files/screenshots ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTS-UI-validation
          path: |
            ui-screenshots/*.png
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
