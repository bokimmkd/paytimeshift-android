name: PTS store screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/store-screenshots.yml"]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: gradle assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p store-screenshots
            adb shell wm size 1080x1920
            adb shell wm density 360
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global policy_control immersive.navigation=*
            adb shell am start -W -n com.paytimeshift.pts/.MainActivity
            sleep 5
            adb exec-out screencap -p > store-screenshots/01-today.png
            adb shell input tap 405 1840
            sleep 2
            adb exec-out screencap -p > store-screenshots/02-calendar.png
            adb shell input tap 675 1840
            sleep 2
            adb exec-out screencap -p > store-screenshots/03-earnings.png
            adb shell input tap 945 1840
            sleep 2
            adb exec-out screencap -p > store-screenshots/04-jobs.png
      - uses: actions/upload-artifact@v4
        with:
          name: PTS-store-screenshots-0.1.6
          path: store-screenshots/*.png
          if-no-files-found: error
