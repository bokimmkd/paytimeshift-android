name: PTS website validation
on:
  push:
    branches: [pts-website, main]
    paths: ['docs/**', '.github/workflows/website.yml', 'website-check.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node website-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTS-website-preview
          path: website-validation/
